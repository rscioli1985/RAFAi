version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nilrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nilrag
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d nilrag"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  db-data:

